[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sahin-lang"
version = "0.0.1"
description = "Şahin programlama dili referans frontend bootstrap"
requires-python = ">=3.11"

[project.scripts]
sahin = "sahin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
