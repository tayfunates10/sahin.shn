name: Stage10 ExpressionStatement patch

on:
  push:
    branches: [stage10-expression-statement-abi]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage10-expression-statement-abi
      - name: Apply fail-closed ExpressionStatement slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing: {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/sahin/semantics.py',
              '    Declaration,\n    FieldDeclaration,',
              '    Declaration,\n    ExpressionStatement,\n    FieldDeclaration,',
          )
          replace(
              'src/sahin/semantics.py',
              '        if isinstance(statement, Write):\n            self._expression(statement.expression, scope)\n            return\n',
              '        if isinstance(statement, ExpressionStatement):\n            self._expression(statement.expression, scope)\n            return\n\n        if isinstance(statement, Write):\n            self._expression(statement.expression, scope)\n            return\n',
          )
          replace(
              'src/sahin/ir.py',
              '        if isinstance(statement, ExpressionStatement):\n            raise IRLoweringError(\n                "Aşama 10 IR v1 ExpressionStatement düğümünü semantik analiz açıkça doğrulayana kadar desteklemiyor."\n            )\n',
              '        if isinstance(statement, ExpressionStatement):\n            # Referans runtime ifadeyi değerlendirir ve yalnız sonucunu atar;\n            # yan etkiler ve runtime hataları normal ifade lowering yolunda korunur.\n            self._expression(statement.expression)\n            return\n',
          )
          replace(
              'tests/test_ir.py',
              'def test_ir_v1_rejects_unvalidated_expression_statement():\n    program = Program(statements=(ExpressionStatement(Name("bilinmeyen")),))\n\n    with pytest.raises(IRLoweringError, match="ExpressionStatement"):\n        lower_program(program)\n',
              'def test_ir_v1_lowers_semantically_valid_expression_statement_and_discards_result():\n    program = Program(statements=(ExpressionStatement(Literal(Decimal("3"))),))\n\n    lowered = lower_program(program)\n\n    assert tuple(item.opcode for item in lowered.instructions) == ("const",)\n    assert lowered.instructions[0].result == "%0"\n\n\ndef test_ir_v1_rejects_semantically_invalid_expression_statement_before_lowering():\n    with pytest.raises(IRLoweringError, match="Semantik doğrulama başarısız"):\n        lower_source("bilinmeyen\\n")\n',
          )

          Path('tests/test_stage10_expression_statement_abi.py').write_text('''from __future__ import annotations\n\nfrom sahin.backend_equivalence import compare_source\nfrom sahin.ir import lower_source\nfrom sahin.native_backend import build_native_plan\nfrom sahin.wasm_backend import build_wasm_plan\n\n\ndef test_expression_statement_direct_call_keeps_side_effect_and_discards_result():\n    source = """akış yankı x\n    yaz x\n    ver x * 2\nyankı(7)\nyaz 9\n"""\n    program = lower_source(source)\n    calls = [item for item in program.instructions if item.opcode == "call"]\n    assert len(calls) == 1\n    assert calls[0].result is not None\n    assert not any(item.opcode == "store" and item.operands[-1] == calls[0].result for item in program.instructions)\n\n    report = compare_source(source)\n    assert report.equivalent\n    assert report.reference.output == ("7", "9")\n\n\ndef test_expression_statement_does_not_open_backend_capabilities():\n    source = """akış kimlik x\n    ver x\nkimlik(4)\n"""\n    program = lower_source(source)\n    wasm = build_wasm_plan(program)\n    native = build_native_plan(program)\n    assert wasm.imports == ()\n    assert native.capabilities == ()\n''', encoding='utf-8')

          replace(
              'README.md',
              'Aşama 10 henüz tamamlanmış değildir. Mevcut IR v1 kapsamındaki `TryStatement` control-flow/error-binding/backend handler ve gözlemlenebilir hata payload/string ABI kapısı kapatıldı. Sıradaki eksik düğümler `ExpressionStatement`, `FieldDeclaration`, diğer `Command` ve diğer `Declaration` düğümleridir; bunlar kendi semantik/ABI/capability modelleriyle kapatılmadan Aşama 10 tamamlanmış sayılmaz.',
              'Aşama 10 henüz tamamlanmış değildir. Mevcut IR v1 kapsamındaki `TryStatement` control-flow/error-binding/backend handler ve gözlemlenebilir hata payload/string ABI kapısı kapatıldı. `ExpressionStatement` semantik analizden geçirilip normal ifade lowering yolu üzerinden sonucu atılarak, yan etkiler/runtime hataları korunacak biçimde kapatıldı. Sıradaki eksik düğümler `FieldDeclaration`, diğer `Command` ve diğer `Declaration` düğümleridir; bunlar kendi semantik/ABI/capability modelleriyle kapatılmadan Aşama 10 tamamlanmış sayılmaz.',
          )
          replace(
              'docs/STAGE10-IR-COVERAGE.md',
              '| `ExpressionStatement` | ⏳ | Semantik geçerliliği açıkça modellenene kadar fail-closed |',
              '| `ExpressionStatement` | ✅ | İfade semantik analizden geçer; normal expression lowering ile değerlendirilir, sonucu atılır, yan etkiler/runtime hataları korunur; backend capability yüzeyi genişlemez |',
          )
          replace(
              'docs/STAGE10-IR-COVERAGE.md',
              '12. ⏳ Kalan `ExpressionStatement`, `FieldDeclaration`, diğer `Command` ve diğer `Declaration` düğümlerini kendi semantik/ABI/capability sözleşmeleriyle fail-closed biçimde kapat.',
              '12. 🚧 `ExpressionStatement` kapatıldı; kalan `FieldDeclaration`, diğer `Command` ve diğer `Declaration` düğümlerini kendi semantik/ABI/capability sözleşmeleriyle fail-closed biçimde kapat.',
          )
          PY
          rm .github/workflows/stage10-expression-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Stage 10: support ExpressionStatement ABI"
          git push origin HEAD:stage10-expression-statement-abi
