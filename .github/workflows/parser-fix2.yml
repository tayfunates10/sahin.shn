name: parser-fix2
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage10-expression-statement-abi
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/sahin/parser.py')
          s=p.read_text(encoding='utf-8')
          a='    Declaration,\n    FieldDeclaration,\n'
          b='    Declaration,\n    ExpressionStatement,\n    FieldDeclaration,\n'
          if a not in s: raise SystemExit('import anchor missing')
          s=s.replace(a,b,1)
          a='''        if self._match(TokenKind.COLON):
            return self._field_declaration(first)

        return self._command(first)
'''
          b='''        if self._match(TokenKind.COLON):
            return self._field_declaration(first)

        if self._at(TokenKind.LPAREN):
            self.index -= 1
            expression = self._finish_expression_line(self._expression())
            return ExpressionStatement(expression, self._loc(first))

        return self._command(first)
'''
          if a not in s: raise SystemExit('route anchor missing')
          p.write_text(s.replace(a,b,1),encoding='utf-8')
          PY
          rm .github/workflows/parser-fix2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Stage 10: route direct calls as ExpressionStatement"
          git push origin HEAD:stage10-expression-statement-abi
