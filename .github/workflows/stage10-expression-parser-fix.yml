name: Stage10 ExpressionStatement parser fix

on:
  push:
    branches: [stage10-expression-statement-abi]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage10-expression-statement-abi
      - name: Repair source-level ExpressionStatement routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/sahin/parser.py')
          text = path.read_text(encoding='utf-8')

          old_import = '    Declaration,\n    FieldDeclaration,\n'
          new_import = '    Declaration,\n    ExpressionStatement,\n    FieldDeclaration,\n'
          if old_import not in text:
              raise SystemExit('parser import anchor missing')
          text = text.replace(old_import, new_import, 1)

          old_route = '''        if self._match(TokenKind.COLON):
            return self._field_declaration(first)

        return self._command(first)
'''
          new_route = '''        if self._match(TokenKind.COLON):
            return self._field_declaration(first)

        # Identifier-led parenthesized calls are expressions, not command syntax.
        # Rewind the already-consumed identifier so the normal expression parser
        # owns the complete call/postfix/binary/pipeline grammar and source location.
        if self._at(TokenKind.LPAREN):
            self.index -= 1
            expression = self._finish_expression_line(self._expression())
            return ExpressionStatement(expression, self._loc(first))

        return self._command(first)
'''
          if old_route not in text:
              raise SystemExit('parser routing anchor missing')
          text = text.replace(old_route, new_route, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/stage10-expression-parser-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Stage 10: route direct calls as ExpressionStatement"
          git push origin HEAD:stage10-expression-statement-abi
